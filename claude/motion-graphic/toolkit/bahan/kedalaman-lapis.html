<!doctype html><!-- Material demo: depth through layers, scale, occlusion and distance blur. Values from 25-k3-tipografi-3d-balon, 24-k8-toggle-lanskap-3d.
Mechanism: 3 planes. Far plane: large soft shapes blurred 18-30 px. Focus plane: one object, sharp, with the frame's only hard shadow.
Near plane: one object cropped by the frame edge, blurred 28-40 px, slightly larger and lighter. Blur grows with distance from the focus plane. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
.f{position:relative;width:1920px;height:1080px;font-family:"General Sans",sans-serif;
 background:radial-gradient(90% 80% at 40% 30%, #fff 0%, #f6eeee 50%, #ead9dc 100%)}
.n{position:absolute;border-radius:6px;font:500 26px "General Sans";color:#2a2330;padding:22px 26px;box-sizing:border-box}
.far{filter:blur(22px);opacity:.85}
.near{filter:blur(34px)}
.focus{box-shadow:0 3px 4px rgba(60,20,30,.25),0 30px 60px -20px rgba(80,20,40,.35)}
.t{position:absolute;left:0;right:0;top:770px;text-align:center;font:600 84px "General Sans";letter-spacing:-2.5px;color:#26151c}
</style></head><body><div class="f">
<div class="n far" style="left:120px;top:90px;width:520px;height:300px;background:#f2a7b8;transform:rotate(-9deg)"></div>
<div class="n far" style="left:1380px;top:120px;width:460px;height:260px;background:#c7b3f0;transform:rotate(7deg)"></div>
<div class="n far" style="left:1260px;top:640px;width:380px;height:250px;background:#f5d58e;transform:rotate(-4deg)"></div>
<div class="n far" style="left:260px;top:600px;width:300px;height:200px;background:#9fd9c3;transform:rotate(10deg)"></div>
<div class="n focus" style="left:700px;top:250px;width:520px;height:400px;background:#ffe27a;transform:rotate(-3deg)">
 <div style="font:600 44px 'General Sans';margin-bottom:18px">Before Friday</div>
 <div style="line-height:1.55">• send the invoice<br>• call the printer<br>• book the venue<br>• reply to Dana</div></div>
<div class="n focus" style="left:1090px;top:430px;width:300px;height:230px;background:#ff8fa3;transform:rotate(6deg);font:500 30px 'General Sans'">draft v3<br>ready to send</div>
<div class="n near" style="left:-160px;top:-120px;width:760px;height:460px;background:#ff6f8a;transform:rotate(14deg)"></div>
<div class="n near" style="left:1500px;top:820px;width:640px;height:420px;background:#b9a3ff;transform:rotate(-12deg)"></div>
<div class="t">four notes, one desk</div>
</div></body></html>
