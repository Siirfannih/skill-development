<!doctype html><!-- Material demo: one glass/light material on a dark field. Values from 34-k6-kolom-cari, 35-k3-cincin-zoom.
Mechanism: the light lives IN one object (a ring of emissive glass); the field stays near-black; the input pill borrows the same
cyan only as a thin rim highlight on its top edge. One hue, one emitter, everything else is lit by it. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
.f{position:relative;width:1920px;height:1080px;font-family:"General Sans",sans-serif;
 background:radial-gradient(70% 70% at 50% 50%, #08191d 0%, #030809 70%)}
.ring{position:absolute;left:460px;top:40px;width:1000px;height:1000px;border-radius:50%;
 background:conic-gradient(from 200deg, transparent 0deg, oklch(0.85 0.14 195) 40deg, oklch(0.6 0.12 200 / .6) 90deg, transparent 150deg,
   transparent 200deg, oklch(0.8 0.13 190 / .9) 250deg, oklch(0.55 0.1 200 / .4) 300deg, transparent 350deg);
 -webkit-mask:radial-gradient(closest-side, transparent 70%, #000 74%, #000 90%, transparent 97%);mask:radial-gradient(closest-side, transparent 70%, #000 74%, #000 90%, transparent 97%);
 filter:blur(22px);transform:rotateX(48deg) rotateZ(-24deg)}
.ring.core{filter:blur(3px);opacity:.75}
.pill{position:absolute;left:520px;top:488px;width:880px;height:104px;border-radius:52px;
 background:linear-gradient(180deg,#0e2226 0%,#061113 100%);
 box-shadow:inset 0 1.5px 0 oklch(0.85 0.12 195 / .85), inset 0 -1px 0 #ffffff10, 0 20px 50px #000a, 0 0 0 1px #9ff3ff22}
.pill span{position:absolute;left:52px;top:31px;font-size:36px;color:#d9f6f8}
.pill svg{position:absolute;right:44px;top:30px}
</style></head><body><div class="f">
<div class="ring"></div><div class="ring core"></div>
<div class="pill"><span>Which supplier answered last week?</span>
<svg width="44" height="44" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="#d9f6f8" stroke-width="2"/><path d="M16 16 L21 21" stroke="#d9f6f8" stroke-width="2" stroke-linecap="round"/></svg></div>
</div></body></html>
